# AT32F405 flash write test through P4 SWD probe + OpenOCD.
# Target: scratch sector 0x0800C000 (all-0xFF, unused app space).
# unlock -> erase -> program 512-word pattern -> spot check -> lock.
init
halt

mem2array ctrl 32 0x40023C10 1
echo "== CTRL before unlock: $ctrl(0)"
mww 0x40023C04 0x45670123
mww 0x40023C04 0xCDEF89AB
mem2array ctrl 32 0x40023C10 1
echo "== CTRL after unlock:  $ctrl(0)"

# clear sticky error flags (W1C): prgmerr(0x4)|epperr(0x10)
mww 0x40023C0C 0x14

# --- sector erase 0x0800C000 ---
mww 0x40023C14 0x0800C000
mww 0x40023C10 0x42
set waited 0
mem2array sts 32 0x40023C0C 1
while {[expr {$sts(0) & 1}]} { incr waited; if {$waited > 500} { echo "== ERASE TIMEOUT"; break }; mem2array sts 32 0x40023C0C 1 }
mww 0x40023C10 0x00
mem2array sts 32 0x40023C0C 1
echo "== STS after erase: $sts(0) (waited $waited)"
echo "== spot after erase: [mdw 0x0800C000 2] [mdw 0x0800C7FC 2]"

# --- program 512 words ---
set bad 0
for {set i 0} {$i < 512} {incr i} {
    set addr [expr {0x0800C000 + $i * 4}]
    set data [expr {(($i * 0x1234567) ^ 0xDEADBEEF) & 0xFFFFFFFF}]
    if {$i >= 395 && $i <= 404} { echo "== i=$i addr=[format 0x%08x $addr] data=[format 0x%08x $data]" }
    mww 0x40023C10 0x01
    mww $addr $data
    set waited 0
    mem2array sts 32 0x40023C0C 1
    while {[expr {$sts(0) & 1}]} { incr waited; if {$waited > 500} { echo "== PROGRAM TIMEOUT at $addr"; incr bad; break }; mem2array sts 32 0x40023C0C 1 }
    mww 0x40023C10 0x00
    if {$i == 0} { echo "== first word programmed, waited=$waited" }
}
echo "== program done, timeouts: $bad"
mem2array sts 32 0x40023C0C 1
echo "== STS after program: $sts(0)"
echo "== spot after program: [mdw 0x0800C000 4]"
echo "== spot tail: [mdw 0x0800C7F8 2]"

mww 0x40023C10 0x80
mem2array ctrl 32 0x40023C10 1
echo "== CTRL after lock: $ctrl(0)"
resume
shutdown
