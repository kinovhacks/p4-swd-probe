# Restore scratch sector 0x0800C000 to all-0xFF state.
init
halt
mww 0x40023C04 0x45670123
mww 0x40023C04 0xCDEF89AB
mww 0x40023C0C 0x14
mww 0x40023C14 0x0800C000
mww 0x40023C10 0x42
set waited 0
mem2array sts 32 0x40023C0C 1
while {[expr {$sts(0) & 1}]} { incr waited; if {$waited > 500} { echo "== ERASE TIMEOUT"; break }; mem2array sts 32 0x40023C0C 1 }
mww 0x40023C10 0x00
mem2array sts 32 0x40023C0C 1
echo "== STS after restore erase: $sts(0) (waited $waited)"
echo "== spot restored: [mdw 0x0800C000 2] [mdw 0x0800C400 2] [mdw 0x0800C7FC 2]"
mww 0x40023C10 0x80
resume
shutdown
