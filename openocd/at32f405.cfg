# Artery AT32F405 (Cortex-M4) target.
#
# OpenOCD has no flash driver for the AT32F405, so flash operations must use
# the register-level scripts in examples/at32f405/ or a generated script from
# tools/gen_at32f405_flash_cfg.py.
source [find target/swj-dp.tcl]
swj_newdap at32f405 cpu -expected-id 0x2ba01477
dap create at32f405.dap -tap at32f405.cpu
target create at32f405.cpu cortex_m -dap at32f405.dap

# The application firmware disables SWD after boot on the tested board.
# To attach in the reset window, override with:
#   -c 'reset_config srst_only srst_nogate connect_assert_srst'
reset_config none
